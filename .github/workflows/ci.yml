name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:

jobs:
  code-quality:
    name: Build & typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Server dependency audit
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Client dependency audit
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy
    needs: [code-quality, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy to dev (feature branch)
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: echo "TODO: deploy to the dev environment"
      - name: Deploy to prod (master)
        if: github.ref == 'refs/heads/master'
        run: echo "TODO: deploy to the prod environment"
